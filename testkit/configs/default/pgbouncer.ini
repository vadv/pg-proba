[databases]
example_db = host=127.0.0.1 port=${PG_PORT} dbname=example_db pool_size=10

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = ${PGBOUNCER_PORT}
unix_socket_dir =
auth_type = trust
auth_file = ${PGBOUNCER_USERLIST}
; lib/pq, JDBC и другие мейнстрим-драйверы шлют extra_float_digits в startup —
; без этого пулер режет коннект (прямой PG принимает)
ignore_startup_parameters = extra_float_digits
pool_mode = transaction
max_client_conn = 200
