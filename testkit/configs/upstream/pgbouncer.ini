[databases]
; Database aliases mirror upstream test.ini (tag pgbouncer_1_26_1) — only
; the ones actually needed by the seven vendored suite files.
; The commented "* = ..." line below is toggled on by test_no_database.py's
; auto-database tests via ini edit + admin RELOAD (same trick as upstream
; test.ini: "; commented out except for auto-database tests").
;* = host=127.0.0.1 port=${PG_PORT}
; Explicit entry for an unknown-to-PG database: test_no_database_pg asserts on
; the PG-side error text relayed by the pooler (same as upstream test.ini).
non_existing_pg_db = host=127.0.0.1 port=${PG_PORT} dbname=non_existing_pg_db
p0 = host=127.0.0.1 port=${PG_PORT} dbname=p0 user=bouncer pool_size=2 reserve_pool_size=2
p1 = host=127.0.0.1 port=${PG_PORT} dbname=p1 user=bouncer
p2 = host=127.0.0.1 port=${PG_PORT} dbname=p0 max_db_connections=4
p3 = host=127.0.0.1 port=${PG_PORT} dbname=p0 user=bouncer pool_mode=session
p3x = host=127.0.0.1 port=${PG_PORT} dbname=p0 user=bouncer pool_mode=transaction
p9 = host=127.0.0.1 port=${PG_PORT} dbname=p0 server_lifetime=2 user=bouncer
varcache_change = host=127.0.0.1 port=${PG_PORT} dbname=p0 client_encoding=SQL_ASCII
authdb = host=127.0.0.1 port=${PG_PORT} dbname=p1 auth_user=pswcheck

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = ${PGBOUNCER_PORT}
unix_socket_dir =
auth_type = trust
auth_file = ${PGBOUNCER_USERLIST}
pool_mode = transaction
; Upstream test.ini runs statement globally and flips to transaction at
; runtime via admin SET (10 call sites); we declare transaction statically
; instead (pool_mode is the only knob those SETs touched).
; Upstream test.ini leaves max_prepared_statements unset (tag default 0)
; and relies on a fresh pooler per test (their fixtures are function-scoped).
; Probes in issue #2: with 0, stock 1.26.1 in statement mode hands a reused
; server connection with foreign prepared statement names to a new client
; (DuplicatePreparedStatement "_pg3_0"). 200 = tag default maximum; tests
; that need a specific value set it via the admin console.
max_prepared_statements = 200
server_check_delay = 10
max_client_conn = 10
default_pool_size = 5
server_lifetime = 120
server_idle_timeout = 60
ignore_startup_parameters = extra_float_digits
admin_users = pgbouncer
stats_users = pgbouncer
