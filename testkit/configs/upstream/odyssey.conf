# Translation of the upstream PgBouncer suite profile (testkit/configs/upstream)
# for Odyssey. Semantics follow upstream test.ini of pgbouncer_1_26_1:
#   p0  pool_size 2 + reserve 2 (reserve pools dropped in odyssey 1.7: no
#       pool_reserve directive, so p0 runs with plain pool_size 2), statement
#       mode approximated by transaction (no statement pooling in Odyssey;
#       p3 keeps session parity)
#   p1  plain pool
#   p2  max_db_connections 4 -> approximated with pool_size 4 (Odyssey has
#       no per-database server connection cap)
#   p3  session mode
#   p3x transaction mode
#   p9  server_lifetime 2s -> not available per-database in Odyssey, omitted
# Every route uses `user default` (any client username, passed through to
# the server) to match pgbouncer auth_type=trust over the auth_file users.
daemonize no
locks_dir "/tmp"
log_format "%p %t %l [%i %s] (%c) %m\n"
log_to_stdout yes
log_config yes
log_debug no
log_session no
log_stats no
coroutine_stack_size 24
workers 2
client_max 100

listen {
  host "127.0.0.1"
  port ${ODYSSEY_PORT}
  tls "disable"
}

storage "pg0" {
  type "remote"
  host "127.0.0.1"
  port ${PG_PORT}
}

# varcache_change (client_encoding=SQL_ASCII) and authdb (auth_query with
# pswcheck) have no Odyssey equivalent; tests relying on them are expected
# to fail or skip here - that is matrix data, not a hidden gap.

database "p0" {
  user default {
    authentication "none"
    storage "pg0"
    storage_db "p0"
    pool "transaction"
    pool_size 2
    pool_timeout 5000
  }
}

database "p1" {
  user default {
    authentication "none"
    storage "pg0"
    storage_db "p1"
    pool "transaction"
    pool_size 5
    pool_timeout 5000
  }
}

database "p2" {
  user default {
    authentication "none"
    storage "pg0"
    storage_db "p0"
    pool "transaction"
    pool_size 4
    pool_timeout 5000
  }
}

database "p3" {
  user default {
    authentication "none"
    storage "pg0"
    storage_db "p0"
    pool "session"
    pool_timeout 5000
  }
}

database "p3x" {
  user default {
    authentication "none"
    storage "pg0"
    storage_db "p0"
    pool "transaction"
    pool_timeout 5000
  }
}

database "p9" {
  user default {
    authentication "none"
    storage "pg0"
    storage_db "p0"
    pool "transaction"
    pool_size 5
    pool_timeout 5000
  }
}
