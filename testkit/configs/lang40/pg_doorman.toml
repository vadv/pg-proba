[general]
host = "127.0.0.1"
port = ${DOORMAN_PORT}
admin_username = "admin"
admin_password = "admin"
pg_hba.content = "host all all 127.0.0.1/32 trust"
prepared_statements = true
# апстрим-семантика языковых семейств: кэш 10000, пул 40 (bdd-tests.yml inline-конфиги)
prepared_statements_cache_size = 10000
# TLS опционален: plaintext-коннекты работают, на SSLRequest отвечает S
tls_private_key = "/workspace/testkit/certs/server.key"
tls_certificate = "/workspace/testkit/certs/server.crt"

[pools.example_db]
server_host = "127.0.0.1"
server_port = ${PG_PORT}
pool_mode = "transaction"

[[pools.example_db.users]]
username = "example_user_1"
password = ""
pool_size = 40
