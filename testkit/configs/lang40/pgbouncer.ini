[databases]
example_db = host=127.0.0.1 port=${PG_PORT} dbname=example_db pool_size=40

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = ${PGBOUNCER_PORT}
unix_socket_dir =
auth_type = trust
auth_file = ${PGBOUNCER_USERLIST}
pool_mode = transaction
; pgjdbc шлёт extra_float_digits в startup-пакете; без этой строки pgbouncer рвёт коннект (JDBC/HikariCP out-of-the-box)
ignore_startup_parameters = extra_float_digits
max_client_conn = 200
; апстрим-семантика языковых семейств: кэш 10000 (doorman), эквивалент для pgbouncer
max_prepared_statements = 10000
; allow: plaintext и TLS на одном порту
client_tls_sslmode = allow
client_tls_cert_file = /workspace/testkit/certs/server.crt
client_tls_key_file = /workspace/testkit/certs/server.key
; самоподписанный серт — сам себе CA
client_tls_ca_file = /workspace/testkit/certs/server.crt
