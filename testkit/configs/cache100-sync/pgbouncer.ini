[databases]
example_db = host=127.0.0.1 port=${PG_PORT} dbname=example_db pool_size=10

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = ${PGBOUNCER_PORT}
unix_socket_dir =
auth_type = trust
auth_file = ${PGBOUNCER_USERLIST}
pool_mode = transaction
max_client_conn = 200
max_prepared_statements = 100
; lib/pq, JDBC и другие мейнстрим-драйверы шлют extra_float_digits в startup — без этого пулер режет коннект
; search_path в ignore НЕ ставить: ignore глушит параметр до трекинга, и pgbouncer перестаёт применять клиентский search_path (0218)
ignore_startup_parameters = extra_float_digits
; pgbouncer трекает search_path из startup-пакета и применяет на сервере при checkout
track_extra_parameters = search_path
