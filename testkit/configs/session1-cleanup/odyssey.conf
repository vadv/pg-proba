daemonize no
locks_dir "/tmp"
log_format "%p %t %l [%i %s] (%c) %m\n"
log_to_stdout yes
log_config yes
log_debug no
log_session no
log_stats no
coroutine_stack_size 24
workers 2
client_max 200

listen {
  host "127.0.0.1"
  port ${ODYSSEY_PORT}
  tls "disable"
}

storage "pg0" {
  type "remote"
  host "127.0.0.1"
  port ${PG_PORT}
}

database "example_db" {
  user "example_user_1" {
    authentication "none"
    storage "pg0"
    storage_db "example_db"
    pool "session"
    pool_size 1
    pool_timeout 5000
    pool_discard yes
  }
}
